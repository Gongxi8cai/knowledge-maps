name: build maps

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.html'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: generate maps
        env:
          JAVA_OUT: ${{ github.workspace }}
          MAPS_OUT: ${{ github.workspace }}
        run: |
          python src/java_map.py
          python src/build_maps.py

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "auto: rebuild knowledge maps"
            git push
          fi
